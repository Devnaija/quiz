services:
  - type: web
    name: django-quiz
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn quiz_project.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: quiz-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: quiz-db
    databaseName: quiz
    user: quiz
    plan: free
